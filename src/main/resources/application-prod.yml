spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/productmigration

app:
  seed:
    enabled: false
  jwt:
    secret: ${JWT_SECRET}
  aes:
    secret: ${AES_SECRET}
  hmac:
    secret: ${HMAC_SECRET}

