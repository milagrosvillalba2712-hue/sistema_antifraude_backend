services:
  # Base legacy conservada exclusivamente para rollback y auditoria.
  postgres:
    image: postgres:16
    container_name: antifraude-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: postgres -c default_transaction_read_only=off
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres-canonical:
    image: postgres:16
    container_name: regula-db-canonical
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    ports:
      - "${CANONICAL_DB_PORT:-5433}:5432"
    volumes:
      - canonical_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Servidor de BD del cliente (banco suscriptor): aislado del CP de Regula.
  # Simula el PostgreSQL que corre dentro de la red del banco.
  postgres-banco:
    image: postgres:16
    container_name: regula-db-banco
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    ports:
      - "${BANCO_DB_PORT:-5434}:5432"
    volumes:
      - banco_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
    name: sistema_antifraude_backend_pgdata
  canonical_pgdata:
    name: regula_pgdata_canonical
  banco_pgdata:
    name: regula_pgdata_banco
